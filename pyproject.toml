[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phytoreg"
dynamic = ["version"]
description = "Multi-species DNA regulatory model with independent track readouts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
dev = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
phytoreg = "phytoreg.cli:main"
phytoreg-inspect = "phytoreg.cli:inspect_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["phytoreg", "phytoreg.*"]
